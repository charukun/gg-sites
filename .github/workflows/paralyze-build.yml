name: PARALYZE AREA build check
# Cloudflare Workers Builds handles automatic build/deploy; keep this as manual fallback.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code-frontend/package-lock.json
      - run: npm install
      - run: CI=false npm run build
