name: PARALYZE AREA live endpoint check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paralyze-live-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase museum preview
        shell: bash
        run: |
          set -e
          URL="https://jfaeqbyxsolqnrhbnrnt.supabase.co/functions/v1/museum-preview"
          code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL")
          echo "status=$code"
          test "$code" = "200"
          grep -q "PARALYZE AREA" /tmp/page.html
          grep -q "SCROLL TO WALK" /tmp/page.html
          echo "LIVE_URL=$URL"
