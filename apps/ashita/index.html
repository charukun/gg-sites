<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(n,cl='')=>`<svg class="icon ${cl}" aria-hidden="true"><use href="#${n}"/></svg>`;
const KEY='ashita:charukun:future-diary:v1',CITIES=['あなたの街','東京','横浜','名古屋','大阪','京都','福岡','札幌','その他'],TIMES=['10:00','11:00','13:00','14:00','15:00','16:00','17:00'];
const ACT={cafe:{title:'いつもと違う、一杯を。',short:'喫茶と余白',sub:'コーヒーから、はじまる。',place:'明るい時間のカフェ',duration:45,steps:['気になっていたカフェを、ひとつ選ぶ。','いつもと違う一杯を、頼んでみる。','今日の小さな発見を、ひとつ覚えておく。'],story:['いつもなら通り過ぎるカフェで、','<mark>いつもと違う一杯</mark>を頼んだ。','窓からの光が、カップの縁を照らしていた。','「それ、おいしそうですね」','もしも、そんな声が聞こえたら。','今日の寄り道は、何かの始まりになるかもしれない。']},book:{title:'同じ一行で、立ち止まる。',short:'本と寄り道',sub:'好きな一行が、目印。',place:'街の本屋・ブックカフェ',duration:45,steps:['明るい時間に、気になる本屋へ。','表紙にひかれた本を、一冊手に取る。','誰かに話したい一行を、覚えておく。'],story:['予定のない午後、街の本屋に入った。','ふと、<mark>表紙にひかれた一冊</mark>を手に取る。','隣の棚の前でも、誰かが立ち止まっていた。','好きな一行が、同じだったら。','言葉からはじまる出会いも、きっと悪くない。','そんな未来を、少しだけ想像した。']},walk:{title:'少し遠回りの、帰り道。',short:'緑と深呼吸',sub:'歩幅から、近づいていく。',place:'人のいる公園・遊歩道',duration:30,steps:['昼間、人のいる公園を選ぶ。','スマホをしまって、少し歩いてみる。','きれいだと思った景色を、覚えておく。'],story:['緑のある道を、いつもよりゆっくり歩いた。','足を止めて、<mark>深呼吸をひとつ</mark>。','葉のすき間から、柔らかな光が落ちていた。','同じ景色を、きれいだと思う誰か。','いつかその人と、言葉を交わせたら。','なんでもない道が、特別な帰り道になる。']}};
const NAV=[['home','mail','未来の日記'],['journal','book','日記帳'],['connections','heart','出会い'],['profile','user','わたし']];
function uid(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function day(add=0){const d=new Date(Date.now()+add*864e5);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d)}
function nice(date){return new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short',timeZone:'Asia/Tokyo'}).format(new Date(date+'T12:00:00+09:00'))}
function dateOK(x){return typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(Date.parse(x+'T12:00:00+09:00'))&&new Date(x+'T12:00:00+09:00').toISOString().slice(0,10)===x}
function validPlan(p){return p&&/^[a-f0-9]{24}$/.test(p.id)&&dateOK(p.date)&&TIMES.includes(p.time)&&CITIES.includes(p.city)&&Object.hasOwn(ACT,p.mood)}
function fresh(){return {prefs:{nick:'',city:'あなたの街',mood:'cafe',time:'14:00',intent:'どちらも'},draft:null,opened:false,journal:[],invites:[],received:[]}}
let S=fresh(),storageOK=true,page='home',incoming=null,shareURL='',toastTimer;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'){if(v.prefs&&CITIES.includes(v.prefs.city)&&Object.hasOwn(ACT,v.prefs.mood)&&TIMES.includes(v.prefs.time)){S.prefs={...S.prefs,...v.prefs,nick:String(v.prefs.nick||'').slice(0,20)}}S.draft=validPlan(v.draft)?v.draft:null;S.opened=v.opened===true;S.journal=Array.isArray(v.journal)?v.journal.filter(r=>validPlan(r.p)&&Array.isArray(r.steps)).slice(-50).map(r=>({...r,steps:[0,1,2].map(i=>!!r.steps[i]),note:String(r.note||'').slice(0,300)})):[];S.invites=Array.isArray(v.invites)?v.invites.filter(r=>validPayload(r.payload,false)).slice(-30):[];S.invites=S.invites.map(r=>({...r,status:['waiting','replied','confirmed'].includes(r.status)?r.status:'waiting',peer:String(r.peer||'').slice(0,20)}));S.received=Array.isArray(v.received)?v.received.filter(r=>validPayload(r.payload,false)).slice(-30):[];S.received=S.received.map(r=>({...r,status:r.status==='confirmed'?'confirmed':'replied',me:String(r.me||'').slice(0,20)}))}}catch{storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch{storageOK=false;toast('ブラウザに保存できません。閉じると記録が失われます。')}}
function newPlan(mood=S.prefs.mood,date=day(1)){return {id:uid(),date,time:S.prefs.time,city:S.prefs.city,mood}}
if(!S.draft||S.draft.date<day()){S.draft=newPlan();S.opened=false;save()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function modal(title,body){$('#modal-body').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="閉じる">${icon('close')}</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
function record(p=S.draft){return S.journal.find(r=>r.p.id===p.id)}
function details(p){return `<div class="plan-details"><span>${icon('calendar')}${nice(p.date)}</span><span>${icon('clock')}${p.time} · ${ACT[p.mood].duration}分</span><span>${icon('pin')}${esc(p.city)}</span></div>`}
function navHTML(){return NAV.map(([p,i,t])=>`<button class="nav-btn" data-page="${p}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('')}
function render(){$('.nav').innerHTML=navHTML();$('.mobile-nav').innerHTML=navHTML();const views={home:homeView,journal:journalView,connections:connectionsView,profile:profileView};$('#main').innerHTML=views[page]();if(!storageOK)$('#main').insertAdjacentHTML('afterbegin','<p class="notice">このブラウザでは記録を保存できていません。ページを閉じると失われる場合があります。</p>')}
function homeView(){const p=S.draft,a=ACT[p.mood],d=p.date.split('-');return `${incoming?'<div class="incoming-banner"><div><span class="eyebrow">A LETTER FOR YOU</span><p>共有された日記が届いています。</p></div><button class="btn secondary" data-action="incoming">届いた日記を見る</button></div>':''}<section class="intro"><div><div class="eyebrow">A LETTER FROM TOMORROW</div><h1>その出会いは、<br>まだ<em>日記の中。</em></h1><p>未来のあなたから、一通の日記が届いています。<br>ほんの少し、いつもと違う明日を選んでみませんか。</p></div><div class="date-mini"><span>NEXT CHAPTER</span><b>${d[1]}.${d[2]}</b><span>未来からの一通</span></div></section><div class="dashboard"><section class="mailbox" aria-label="未来から届いた日記"><div class="mailbar"><span class="from"><span class="dot"></span>${S.opened?'開封した日記':'未来から、1通の日記が届きました'}</span><span class="eyebrow">LETTER 001</span></div>${S.opened?paperView(p):sealedView(p)}</section><aside class="side-stack"><section class="card"><div class="card-title"><h2>あなたの、次の一歩</h2>${icon('sun')}</div><div class="weather"><div><h3>${nice(p.date)}</h3><p>まだ白紙の、ある一日。</p></div><span class="sun-disc">${icon(a===ACT.walk?'walk':'sun')}</span></div><div class="pref-row"><span>${icon('pin')}エリア</span><b>${p.city==='あなたの街'?'まだ決めていない':esc(p.city)}</b></div><div class="pref-row"><span>${icon('clock')}時間</span><b>${p.time}ごろ</b></div><div class="pref-row"><span>${icon(p.mood)}気分</span><b>${a.short}</b></div><button class="text-btn pref-change" data-page="profile">未来の条件を変える ${icon('arrow')}</button></section><section class="card connection-card"><div class="constellation" aria-hidden="true"><div class="avatar">私</div><span></span>${icon('spark')}<span></span><div class="avatar other">？</div></div><h3>同じ未来を選ぶ、<br>まだ知らない誰か。</h3><p>顔や条件よりも先に、<br>一緒に過ごす一日から。</p><button class="text-btn" data-page="connections">出会いのしくみ ${icon('arrow')}</button></section><div class="safety-line">${icon('shield')}<span>行動はいつでも自由。出会いの保証はありません。<br>公開体験版では実会員の自動紹介は行いません。</span></div></aside></div><section><div class="section-head"><h2>どんな明日に、会いにいく？</h2><p>気分を選ぶと、日記が変わります。</p></div><div class="moods">${Object.entries(ACT).map(([k,a])=>`<button class="mood ${p.mood===k?'selected':''}" data-mood="${k}" aria-pressed="${p.mood===k}"><div class="mood-picture ${k}">${icon(k)}</div><div class="mood-content"><div><b>${a.short}</b><small>${a.sub}</small></div>${icon('arrow')}</div></button>`).join('')}</div></section>`}
function sealedView(p){return `<div class="post-scene"><div class="orbit" aria-hidden="true"></div><span class="scene-star star-a" aria-hidden="true">✧</span><span class="scene-star star-b" aria-hidden="true">✧</span><button class="envelope" data-action="open" aria-label="未来からの封筒を開く"><span class="flap"></span><span class="stamp">FUTURE<br>${icon('sun')}</span><span class="seal">${icon('walk')}</span><span class="address">To. ${esc(S.prefs.nick||'いまを生きるあなた')} へ</span></button><span class="scene-caption">SENT FROM YOUR TOMORROW</span></div><div class="mail-copy"><h2>「あの日、出かけてよかった。」</h2><p>そんな未来のあなたから、届いた日記。<br>まだ起きていない物語を、そっと開いてみる。</p><button class="btn" data-action="open">${icon('mail')}未来の日記をひらく ${icon('arrow')}</button><div class="postscript">登録不要で体験できます。音は鳴りません。</div></div>`}
function paperView(p){const a=ACT[p.mood],r=record(p);return `<div class="paper fade-in"><div class="paper-meta">${p.date.replaceAll('-','.')} / ${p.time}</div><h2>${a.title}</h2><div class="diary-lines">${a.story.join('<br>')}</div><div class="signature">未来の、${esc(S.prefs.nick||'あなた')}より</div><div class="paper-note">これは選んだ条件から作られる物語です。実際の出来事や誰かの参加を予言・保証するものではありません。</div>${details(p)}</div><div class="paper-actions">${r?`<div class="notice good">${icon('check')} この未来を、あなたの一日に選びました。</div><div class="btn-row" style="margin-top:13px"><button class="btn" data-action="invite">${icon('share')}誰かと同じ未来へ</button><button class="btn secondary" data-action="calendar">${icon('calendar')}予定を保存</button></div>`:`<button class="btn wide" data-action="choose">この未来を選んでみる ${icon('arrow')}</button>`}<button class="text-btn change-future" data-action="regenerate">${icon('refresh')}別の未来を受け取る</button></div>${r?`<div class="checklist"><h3>日記の中の、小さな約束</h3>${a.steps.map((t,i)=>`<label class="task ${r.steps[i]?'done':''}"><input type="checkbox" data-step="${i}" ${r.steps[i]?'checked':''}><span>${t}</span></label>`).join('')}<p class="hint">実際にできたことを、自分でチェック。場所の取得や相手への通知はしません。</p>${r.steps.every(Boolean)?'<button class="text-btn" data-action="note" data-id="'+p.id+'">今日の続きを、日記に残す '+icon('arrow')+'</button>':''}</div>`:''}`}
function pageHeader(en,title,copy){return `<header class="page-header"><div class="eyebrow">${en}</div><h1>${title}</h1><p>${copy}</p></header>`}
function journalView(){return pageHeader('YOUR LITTLE STORIES','日記になった、わたしの一歩。','選んだ未来と、実際に感じたこと。このブラウザだけに残す日記帳です。')+(S.journal.length?`<div class="record-list">${S.journal.slice().reverse().map(r=>`<article class="record"><div class="record-date">${r.p.date.slice(8)}<small>${r.p.date.slice(0,7).replace('-',' / ')}</small></div><div class="record-body"><span class="tag">${r.steps.every(Boolean)?'行動チェック完了':r.p.date<day()?'過去に選んだ未来':'選んだ未来'}</span><h3>${ACT[r.p.mood].title}</h3><p>${esc(r.p.city)} · ${r.p.time} · ${r.steps.filter(Boolean).length}/3 の小さな一歩</p>${r.note?`<p class="record-note">${esc(r.note)}</p>`:''}<div class="btn-row"><button class="text-btn" data-action="reopen" data-id="${r.p.id}">日記を読む ${icon('arrow')}</button><button class="text-btn" data-action="note" data-id="${r.p.id}">${icon('book')}${r.note?'感想を編集':'感想を残す'}</button></div></div></article>`).join('')}</div>`:`<div class="empty">${icon('book')}<h2>最初の一ページは、これから。</h2><p>日記を開いて「この未来を選んでみる」を押すと、<br>ここにあなたの物語が残ります。</p><button class="btn" data-page="home">未来の日記を受け取る ${icon('arrow')}</button></div>`)}
function connectionsView(){const invites=S.invites.slice().reverse(),received=S.received.slice().reverse();return pageHeader('CROSSING TOMORROWS','同じ未来で、待ち合わせ。','同じ日記を渡して、相手が選ぶのを待つ。出会いは、ふたりの意思から。')+`<div class="notice">現在は招待リンクを交換する体験版です。会員検索・自動マッチング・リアルタイム通知・実際のチャットは未接続です。</div><div class="section-head"><h2>ふたりの、これから</h2><span class="eyebrow">YOUR LETTERS</span></div>${invites.length||received.length?`<div class="record-list">${invites.map(r=>`<article class="record"><span class="avatar">${esc((r.peer||'？').slice(0,1))}</span><div class="record-body"><span class="tag">${r.payload.exp<Date.now()?'リンク期限切れ':r.status==='confirmed'?'相互に参加を選択':r.status==='replied'?'参加したい返事が届きました':'招待リンク作成済み'}</span><h3>${r.peer?esc(r.peer)+'さんとの一ページ':ACT[r.payload.p.mood].title}</h3><p>${nice(r.payload.p.date)} ${r.payload.p.time} · ${esc(r.payload.p.city)}</p><p>${r.status==='confirmed'?'確定リンクを相手にも渡してください。店舗予約や待ち合わせの確約ではありません。':r.status==='replied'?'返事を確認して、あなたも一緒に進むか選べます。':'リンクを相手に送り、返事のリンクを受け取ってください。'}</p><div class="btn-row"><button class="text-btn" data-action="invite-detail" data-id="${r.payload.id}">${r.status==='replied'?'返事を確認する':r.status==='confirmed'?'確定リンクを共有':'招待リンクを共有'} ${icon('arrow')}</button></div></div></article>`).join('')}${received.map(r=>`<article class="record"><span class="avatar">${esc(r.payload.n.slice(0,1))}</span><div class="record-body"><span class="tag">${r.status==='confirmed'?'相互に参加を選択':'返事のリンク作成済み'}</span><h3>${esc(r.payload.n)}さんからの未来</h3><p>${nice(r.payload.p.date)} ${r.payload.p.time} · ${esc(r.payload.p.city)}</p><p>${r.status==='confirmed'?'同じ未来を選びました。具体的な場所は相手と別途確認してください。':'返事のリンクを相手に渡し、確定リンクを受け取ってください。'}</p>${r.status!=='confirmed'?`<button class="text-btn" data-action="reply-share" data-id="${r.payload.id}">返事のリンクを共有 ${icon('arrow')}</button>`:''}</div></article>`).join('')}</div>`:`<div class="empty">${icon('heart')}<h2>まだ、交わっていないふたつの日記。</h2><p>まずは、あなたの未来をひとつ選んでみましょう。<br>選んだ日記を、招待リンクで誰かに渡せます。</p><button class="btn" data-action="start-invite">未来を選んで、招待する ${icon('arrow')}</button></div>`}<div class="section-head"><h2>出会いまでの、3ページ。</h2></div><div class="connection-grid"><section class="card"><div class="flow"><div class="flow-item"><span class="flow-no">01</span><div><h3>同じ未来を、手渡す。</h3><p>日記を選び、招待リンクを普段使う連絡手段で送ります。</p></div></div><div class="flow-item"><span class="flow-no">02</span><div><h3>相手も、行ってみたいと思う。</h3><p>相手が参加を選び、返事のリンクをあなたに送ります。</p></div></div><div class="flow-item"><span class="flow-no">03</span><div><h3>ふたりで、最初の一歩へ。</h3><p>あなたも確認し、確定リンクを返します。無理に会う必要はありません。</p></div></div></div></section><section class="card"><span class="demo-label">架空の人物によるサンプル</span><h2 class="serif" style="font-size:21px;margin:18px 0 12px">「あの一行、<br>私も好きでした。」</h2><p class="modal-copy">日記の先で誰かと出会ったら。<br>短い会話の演出を、ひとりで体験できます。</p><button class="btn secondary" data-action="demo">出会いのシーンを体験 ${icon('arrow')}</button></section></div>`}
function profileFields(){return `<div class="fields"><label class="field full">呼ばれたい名前<input name="nick" value="${esc(S.prefs.nick)}" maxlength="20" placeholder="ニックネーム（本名は不要）" autocomplete="off"><small>招待リンクを作るときだけ、相手に共有します。</small></label><label class="field">出かけたい街<select name="city">${CITIES.map(c=>`<option ${S.prefs.city===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">好きな時間（日本時間）<select name="time">${TIMES.map(t=>`<option ${S.prefs.time===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">明日の気分<select name="mood">${Object.entries(ACT).map(([k,a])=>`<option value="${k}" ${S.prefs.mood===k?'selected':''}>${a.short}</option>`).join('')}</select></label><label class="field">出会いに期待すること<select name="intent">${['新しい友だち','恋のきっかけ','どちらも'].map(t=>`<option ${S.prefs.intent===t?'selected':''}>${t}</option>`).join('')}</select><small>体験版ではメモとして保存します。相手の絞り込みには使いません。</small></label></div>`}
function profileView(){return pageHeader('A LITTLE ABOUT YOU','どんな明日に、したい？','細かな条件よりも、あなたの心が動くことを。あとから何度でも変えられます。')+`<div class="settings"><form id="profile-form" class="card"><h2>未来の日記の、宛先。</h2>${profileFields()}<div class="btn-row"><button type="submit" class="btn">この条件で、日記を受け取る ${icon('arrow')}</button></div><p class="hint">保存すると新しい日記が届きます。選択済みの予定・招待は変更されません。</p></form><section class="card"><h2>この体験版での、データの扱い</h2><p class="modal-copy">設定と日記はこのブラウザの保存領域を使います。サーバーへの会員登録、位置情報の取得、メール配信、解析トラッキングは行いません。端末を変えると記録は引き継がれません。</p><p class="modal-copy">招待・返事・確定のリンクにはニックネームと予定が含まれ、リンクを知る人が読めます。本人確認はありません。本名、住所、連絡先、秘密の情報は入力しないでください。</p><div class="btn-row"><button class="btn secondary" data-action="export">記録を書き出す</button><button class="text-btn danger" data-action="reset">このブラウザの記録を削除</button></div></section><button class="text-btn" data-action="safety">${icon('shield')}安心して使うために</button></div>`}
function choose(){const p=S.draft;if(p.date<day()){toast('過去の日記です。別の未来を受け取ってください。');return}if(!record(p)){S.journal.push({p:{...p},steps:[false,false,false],note:''});S.journal=S.journal.slice(-50)}save();render();toast('この未来を、日記帳にしまいました。')}
function note(id){const r=S.journal.find(r=>r.p.id===id);if(!r)return;modal('今日の続きを、ひとこと。',`<p class="modal-copy">${ACT[r.p.mood].title}<br>出会いがなくても、あなたの一日は一ページになります。</p><form id="note-form" data-id="${id}"><label class="field">覚えておきたいこと<textarea name="note" maxlength="300" placeholder="あの一杯が、思ったより好きだった。">${esc(r.note)}</textarea><small>300文字以内。この端末にだけ保存します。</small></label><div class="btn-row"><button class="btn" type="submit">日記に残す ${icon('check')}</button></div></form>`)}
function encode(v){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(v)))).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}
function decode(s){if(s.length>5000||!/^[-_a-zA-Z0-9]+$/.test(s))throw Error();return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(s.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0))))}
function validPayload(v,expiry=true){return !!(v&&v.v===1&&['invite','reply','confirm'].includes(v.t)&&/^[a-f0-9]{24}$/.test(v.id)&&/^[a-f0-9]{24}$/.test(v.secret)&&typeof v.n==='string'&&v.n.trim().length>0&&v.n.length<=20&&validPlan(v.p)&&Number.isFinite(v.exp)&&(!expiry||(v.exp>Date.now()&&v.exp<=Date.now()+32*864e5))&&(!v.peer||(typeof v.peer==='string'&&v.peer.length<=20)))}
function baseURL(){return location.href.split('#')[0].split('?')[0]}
function link(v){return baseURL()+'#letter='+encode(v)}
function showShare(title,url,copy){shareURL=url;modal(title,`<p class="modal-copy">${copy}</p><label class="field">共有するリンク<textarea class="share-field" id="share-link" readonly>${esc(url)}</textarea></label><div class="btn-row"><button class="btn" data-action="copy-link">リンクをコピー ${icon('check')}</button>${navigator.share?'<button class="btn secondary" data-action="native-share">アプリで送る</button>':''}</div><p class="hint">リンクの作成やコピーだけでは相手へ送信されません。ふだんの連絡手段で相手に渡してください。</p>`)}
async function copyLink(){try{await navigator.clipboard.writeText(shareURL);toast('リンクをコピーしました。')}catch{$('#share-link').focus();$('#share-link').select();try{if(document.execCommand('copy'))toast('リンクをコピーしました。');else toast('リンクを選択しました。長押しでコピーしてください。')}catch{toast('リンクを長押ししてコピーしてください。')}}}
function requireWeb(){if(location.protocol==='file:'){toast('招待リンクは公開サイト上で作成してください。');return false}return true}
function inviteForm(){if(!requireWeb())return;const p=S.draft;if(!record(p)){choose()}if(p.date<day()){toast('日付が過ぎています。新しい日記を受け取ってください。');return}modal('同じ未来を、誰かに。',`<p class="modal-copy">相手が同じ日記を読み、「参加したい」を選ぶと、返事のリンクを作れます。実会員への自動紹介はありません。</p><form id="invite-form"><div class="fields"><label class="field full">相手に見せるニックネーム<input name="nick" required maxlength="20" value="${esc(S.prefs.nick)}" placeholder="本名や連絡先は入力しないでください"></label><label class="field">日付（日本時間）<input type="date" name="date" value="${p.date}" min="${day()}" max="${day(30)}" required></label><label class="field">エリア<select name="city">${CITIES.filter(c=>c!=='あなたの街').map(c=>`<option ${c===p.city?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="invite-hero"><span class="eyebrow">${p.time} / ${ACT[p.mood].duration} MIN</span><h3>${ACT[p.mood].title}</h3><p>${ACT[p.mood].place}での一ページ。<br>具体的な店舗・集合場所はまだ決まっていません。</p></div><label class="form-check"><input type="checkbox" name="age" required><span>私は18歳以上です。本人確認のない体験版であることを理解しました。</span></label><label class="form-check"><input type="checkbox" name="consent" required><span>名前・エリア・予定がリンクに含まれ、リンクを知る人が読めることに同意します。</span></label><button class="btn wide" type="submit">招待リンクをつくる ${icon('arrow')}</button><p class="hint">リンクの有効期限は予定日の23:59（日本時間）です。サーバーを使わないため、配布済みリンクを遠隔で無効化する機能はありません。</p></form>`)}
function receiveHash(){if(!location.hash.startsWith('#letter='))return;try{const v=decode(location.hash.slice(8));if(!validPayload(v))throw Error();incoming=v;go('home');showIncoming()}catch{incoming=null;modal('この日記は、開けませんでした。','<p class="modal-copy">リンクが壊れているか、有効期限を過ぎています。送ってくれた人に、新しいリンクを作ってもらってください。</p><button class="btn secondary" data-action="clear-incoming">自分の未来の日記へ</button>')}}
function showIncoming(){if(!incoming)return;const v=incoming;if(!validPayload(v)){modal('日記の期限を過ぎています。','<p class="modal-copy">相手に、新しい日記を受け取ってください。</p>');return}if(v.t==='invite'){if(S.invites.some(r=>r.payload.id===v.id)){modal('これは、あなたの招待です。','<p class="modal-copy">別の人にこのリンクを送ると、その人のブラウザで参加の返事を作れます。自分で参加することはできません。</p><button class="btn secondary" data-action="clear-incoming">日記に戻る</button>');return}modal('未来の日記が届いています。',`<span class="tag">${esc(v.n)}さんからの招待</span><div class="invite-hero"><span class="eyebrow">${nice(v.p.date)} · ${v.p.time}</span><h3>${ACT[v.p.mood].title}</h3><p>${esc(v.p.city)} / ${ACT[v.p.mood].place}</p></div><p class="modal-copy">${ACT[v.p.mood].story.join('')}<br>同じ未来を選んでみませんか。行くかどうかは、あなたが決められます。</p><form id="accept-form"><label class="field">返事に添えるニックネーム<input name="nick" value="${esc(S.prefs.nick)}" maxlength="20" required placeholder="本名や連絡先は不要"></label><label class="form-check"><input type="checkbox" required><span>18歳以上です。ニックネームと参加希望が返事のリンクに含まれることに同意します。相手の本人確認はされていません。</span></label><div class="btn-row"><button class="btn" type="submit">参加したい、と返事を書く</button><button class="btn secondary" type="button" data-action="clear-incoming">今回は見送る</button></div></form>`)}else if(v.t==='reply'){const r=S.invites.find(r=>r.payload.id===v.id&&r.payload.secret===v.secret&&JSON.stringify(r.payload.p)===JSON.stringify(v.p));if(!r){modal('招待を作ったブラウザで開いてください。','<p class="modal-copy">この返事に対応する招待の記録が見つかりません。最初に招待リンクを作った端末・ブラウザで開いてください。</p>');return}if(r.status==='confirmed'&&r.peer!==v.n){modal('この日記は、すでに相手を選んでいます。','<p class="modal-copy">別の人とは、新しい日記と招待リンクを作ってください。</p>');return}r.peer=v.n;r.status=r.status==='confirmed'?'confirmed':'replied';save();confirmView(r)}else{const r=S.received.find(r=>r.payload.id===v.id&&r.payload.secret===v.secret&&r.me===v.peer&&JSON.stringify(r.payload.p)===JSON.stringify(v.p));if(!r){modal('返事を作ったブラウザで開いてください。','<p class="modal-copy">この確定リンクに対応する返事の記録がありません。参加したい返事を作った端末・ブラウザで開いてください。</p>');return}r.status='confirmed';save();modal('同じ未来を、選びました。',`<span class="tag">ふたりの参加意思がそろいました</span><div class="invite-hero"><h3>${esc(v.n)}さんと、最初の一ページ。</h3><p>${nice(v.p.date)} ${v.p.time} · ${esc(v.p.city)}</p></div><p class="modal-copy">これは本人確認や店舗予約ではありません。具体的な場所・時間を相手と別途確認してください。会うかどうかは、いつでも自分で決められます。</p><button class="btn" data-action="finish-incoming">出会いのページへ ${icon('arrow')}</button>`)}}
function confirmView(r){modal('あなたも、同じ未来へ？',`<span class="tag">${esc(r.peer)}さんからの返事</span><div class="invite-hero"><h3>${ACT[r.payload.p.mood].title}</h3><p>${nice(r.payload.p.date)} ${r.payload.p.time} · ${esc(r.payload.p.city)}</p></div><p class="modal-copy">相手も、この日記を選んでみたいと返事しました。リンクを持っている人の自己申告で、本人確認された参加ではありません。</p><div class="btn-row"><button class="btn" data-action="confirm-pair" data-id="${r.payload.id}">私も、一緒に進んでみる</button><button class="btn secondary" data-action="close">今は決めない</button></div>`)}
function payloadReply(r){return {...r.payload,t:'reply',n:r.me}}
function payloadConfirm(r){return {...r.payload,t:'confirm',peer:r.peer}}
function demo(){modal('日記の先で、出会ったら。',`<span class="demo-label">架空の人物「こと」 / 会話の演出サンプル</span><div id="conversation"><div class="message">あの本、手に取っていましたよね。私も、あの一行が好きなんです。</div></div><div class="message-options" id="message-options"><button class="btn secondary" data-chat="あの一行、私も気になっていました。">あの一行、私も気になっていました。</button><button class="btn secondary" data-chat="ほかにも、おすすめの本はありますか？">ほかにも、おすすめの本はありますか？</button></div><p class="hint">実在の相手への送信はありません。返信は体験用の固定文です。</p>`)}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function ics(p){const d=new Date(p.date+'T'+p.time+':00+09:00');if(isNaN(d)||d<Date.now()){toast('過去の予定は保存できません。新しい日記を選んでください。');return}const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ASHITA//Future Diary//JA','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+p.id+'@ashita.demo','DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(d),'DTEND:'+fmt(new Date(+d+ACT[p.mood].duration*60000)),'SUMMARY:あした、 '+ACT[p.mood].title,'LOCATION:'+p.city,'DESCRIPTION:体験版で選んだ予定です。参加者や店舗の予約は確定していません。','END:VEVENT','END:VCALENDAR'];download('ashita-'+p.date+'.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('予定ファイルを作成しました。カレンダーに取り込んでください。')}
function about(){modal('あした、とは。',`<p class="modal-copy">未来の自分が書いたような日記が、いまのあなたに届く。その一日を選ぶことから、誰かと出会うきっかけをつくるサービスです。</p><div class="flow"><div class="flow-item"><span class="flow-no">01</span><div><h3>日記が届く。</h3><p>気分とエリアを選ぶと、未来の一日を描く日記が届きます。</p></div></div><div class="flow-item"><span class="flow-no">02</span><div><h3>自分で未来を選ぶ。</h3><p>日記を道しるべに、少しだけいつもと違う行動を。見送っても構いません。</p></div></div><div class="flow-item"><span class="flow-no">03</span><div><h3>同じ未来から、つながる。</h3><p>同じ日記を選んだ相手と、ふたりの意思で一歩を踏み出します。</p></div></div></div><div class="notice">公開体験版：日記はテンプレート生成です。実会員の自動マッチング、本人確認、サーバー保存、チャット、メール・プッシュ通知は未実装。招待はリンクの手動交換で動きます。</div>`)}
function safety(){modal('あなたの意思が、いちばん。',`<div class="flow"><div class="flow-item">${icon('sun')}<div><h3>初対面は、明るい公共の場所で。</h3><p>人のいるカフェや公園などを選び、店舗の営業や利用条件は別途確認してください。私宅や車内、人のいない場所での待ち合わせは避けましょう。</p></div></div><div class="flow-item">${icon('heart')}<div><h3>日記より、自分の気持ち。</h3><p>従う義務はありません。少しでも不安なら見送り、相手にも無理を求めないでください。</p></div></div><div class="flow-item">${icon('shield')}<div><h3>公開体験版の限界を、知っておく。</h3><p>本人確認、運営の監視、通報窓口、実会員マッチングはまだありません。ニックネームは自己申告で、同一人物かの保証はありません。</p></div></div><div class="flow-item">${icon('share')}<div><h3>共有リンクは、手紙そのもの。</h3><p>リンクを持つ人は内容を読めます。本名・住所・連絡先などは入力しないでください。保存データを削除しても、配布済みリンクや相手の記録は消せません。</p></div></div></div><div class="notice">体験中に会うことや、連絡先を教えることを求めるサービスではありません。行動も共有も、いつでも自分の判断で。</div>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){closeModal();go(b.dataset.page);return}if(b.dataset.mood){S.prefs.mood=b.dataset.mood;S.draft=newPlan(b.dataset.mood);S.opened=false;save();go('home');toast(ACT[b.dataset.mood].short+'の日記が届きました。');return}if(b.dataset.chat){$('#conversation').insertAdjacentHTML('beforeend',`<div class="message mine">${esc(b.dataset.chat)}</div><div class="message">私も同じ日記を選んで、ここに来たんです。なんだか、少し不思議ですね。</div>`);$('#message-options').innerHTML='<button class="btn secondary" data-action="close">日記の世界に戻る</button>';return}const id=b.dataset.id;switch(b.dataset.action){case 'open':S.opened=true;save();render();break;case 'choose':choose();break;case 'regenerate':{const keys=Object.keys(ACT),m=keys[(keys.indexOf(S.draft.mood)+1)%keys.length];S.draft=newPlan(m);S.opened=false;save();render();toast('別の未来から、日記が届きました。');break}case 'about':about();break;case 'safety':safety();break;case 'close':closeModal();break;case 'share-site':if(requireWeb())showShare('この物語を、誰かに。',baseURL(),'「あした、」の公開体験版を共有します。このリンクに、あなたの日記や設定は含まれません。');break;case 'copy-link':await copyLink();break;case 'native-share':try{await navigator.share({title:'あした、｜未来の日記',url:shareURL})}catch(err){if(err.name!=='AbortError')toast('共有できませんでした。リンクをコピーしてください。')}break;case 'invite':inviteForm();break;case 'start-invite':if(record())inviteForm();else{go('home');S.opened=true;save();render();toast('まず「この未来を選んでみる」を押してください。')}break;case 'calendar':ics(S.draft);break;case 'note':note(id);break;case 'reopen':{const r=S.journal.find(r=>r.p.id===id);if(r){S.draft={...r.p};S.opened=true;save();go('home')}break}case 'incoming':showIncoming();break;case 'clear-incoming':incoming=null;history.replaceState(null,'',baseURL());closeModal();go('home');break;case 'finish-incoming':incoming=null;history.replaceState(null,'',baseURL());closeModal();go('connections');break;case 'invite-detail':{const r=S.invites.find(r=>r.payload.id===id);if(!r)break;if(r.payload.exp<Date.now()){toast('期限切れです。新しい日記で招待してください。');break}if(r.status==='replied')confirmView(r);else if(r.status==='confirmed')showShare('ふたりの、確定リンク。',link(payloadConfirm(r)),'このリンクを、返事をくれた相手に送ってください。相手が開くと、相手側にも参加意思がそろった状態が表示されます。');else showShare('未来の日記を、手渡そう。',link(r.payload),'招待リンクができました。相手に渡し、相手が作った返事のリンクをこのブラウザで開いてください。');break}case 'reply-share':{const r=S.received.find(r=>r.payload.id===id);if(r)showShare('参加したい、を届ける。',link(payloadReply(r)),'この返事のリンクを、招待してくれた人に送ってください。これだけではまだ相互確定ではありません。');break}case 'confirm-pair':{const r=S.invites.find(r=>r.payload.id===id);if(!r||r.payload.exp<Date.now()){toast('この日記は期限切れです。');break}r.status='confirmed';save();showShare('ふたりの、確定リンク。',link(payloadConfirm(r)),'このリンクを相手に返すと、相手の画面にも同じ未来を選んだことが表示されます。具体的な待ち合わせは別途相談してください。');render();break}case 'demo':demo();break;case 'export':download('ashita-my-diary.json',JSON.stringify(S,null,2),'application/json');toast('このブラウザの記録を書き出しました。');break;case 'reset':modal('このブラウザの記録を削除しますか？','<p class="modal-copy">設定、日記、招待の記録が削除されます。元に戻せません。配布済みリンクや相手の記録は削除されません。</p><div class="btn-row"><button class="btn" data-action="reset-confirm">記録を削除する</button><button class="btn secondary" data-action="close">残しておく</button></div>');break;case 'reset-confirm':try{localStorage.removeItem(KEY)}catch{}S=fresh();S.draft=newPlan();incoming=null;history.replaceState(null,'',baseURL());save();closeModal();go('home');toast('このブラウザの記録を削除しました。');break}});
document.addEventListener('change',e=>{if(e.target.matches('[data-step]')){const r=record();if(!r)return;r.steps[Number(e.target.dataset.step)]=e.target.checked;save();render();if(r.steps.every(Boolean))toast('あなたの今日が、日記になりました。')}});
document.addEventListener('submit',e=>{const f=e.target;if(!['profile-form','note-form','invite-form','accept-form'].includes(f.id))return;e.preventDefault();const d=new FormData(f);if(f.id==='profile-form'){const nick=String(d.get('nick')||'').trim().slice(0,20);S.prefs={nick,city:d.get('city'),time:d.get('time'),mood:d.get('mood'),intent:d.get('intent')};S.draft=newPlan();S.opened=false;save();go('home');toast('新しい条件で、日記が届きました。')}else if(f.id==='note-form'){const r=S.journal.find(r=>r.p.id===f.dataset.id);if(r){r.note=String(d.get('note')).trim().slice(0,300);save()}closeModal();render();toast('今日の一ページを残しました。')}else if(f.id==='invite-form'){const nick=String(d.get('nick')||'').trim();const date=String(d.get('date')),city=String(d.get('city'));if(!nick){toast('ニックネームを入力してください。');return}if(!dateOK(date)||date<day()||date>day(30)||!CITIES.includes(city)||new Date(date+'T'+S.draft.time+':00+09:00')<=Date.now()){toast('未来の日時を選んでください。今日の時間を過ぎている場合は明日以降にしてください。');return}const old=record(),used=S.invites.some(r=>r.payload.p.id===S.draft.id);const p={...S.draft,id:used?uid():S.draft.id,date,city};const v={v:1,t:'invite',id:uid(),secret:uid(),n:nick.slice(0,20),p,exp:+new Date(date+'T23:59:59+09:00')};S.prefs.nick=v.n;S.invites.push({payload:v,status:'waiting',peer:''});S.invites=S.invites.slice(-30);S.draft=p;if(old&&!used)old.p={...p};else S.journal.push({p:{...p},steps:[false,false,false],note:''});S.journal=S.journal.slice(-50);save();showShare('未来の日記を、手渡そう。',link(v),'招待リンクができました。相手に渡し、相手から返事のリンクが届いたら、招待を作ったこのブラウザで開いてください。');render()}else if(f.id==='accept-form'){const v=incoming,nick=String(d.get('nick')||'').trim().slice(0,20);if(!validPayload(v)||!nick){toast('名前やリンクの有効期限を確認してください。');return}let r=S.received.find(r=>r.payload.id===v.id);if(r&&r.status==='confirmed'){toast('この日記には参加の意思を伝えています。');return}if(!r){r={payload:v,me:nick,status:'replied'};S.received.push(r)}else r.me=nick;S.received=S.received.slice(-30);S.prefs.nick=nick;save();showShare('参加したい、を届ける。',link(payloadReply(r)),'この返事のリンクを、招待してくれた人に送ってください。相手も選ぶと、相手から確定リンクを受け取れます。');render()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('hashchange',receiveHash);render();receiveHash();
</script>
